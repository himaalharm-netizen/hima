<script>
const A={1010:["الخزنة","أصول"],1020:["البنك","أصول"],1030:["البريد","أصول"],1040:["إنستاباي","أصول"],1100:["العملاء (ذمم مدينة)","أصول"],1200:["المخزون","أصول"],2010:["الموردون (ذمم دائنة)","خصوم"],3010:["رأس المال","حقوق ملكية"],3020:["أرصدة أول المدة","حقوق ملكية"],4010:["إيرادات المبيعات","إيرادات"],4020:["خصومات المبيعات","إيرادات"],5000:["تكلفة البضاعة المباعة","مصروفات"],5010:["الرواتب والأجور","مصروفات"],5020:["الإيجار","مصروفات"],5030:["المرافق","مصروفات"],5040:["مصروفات عامة","مصروفات"]};
const T=A=>A;const today=()=>new Date().toISOString().slice(0,10);const nowTime=()=>new Date().toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit",hour12:true});
let S={co:"شركتي",je:[],inv:[],n:1,m:1},view="home",err="";
let LEGACY=null;try{LEGACY=localStorage.getItem("daftar1")}catch(e){}
/* ===== التشفير التلقائي: AES-GCM 256، مفتاح عشوائي للجهاز بدون رقم سري ===== */
const EK="daftar1e",EKP="daftar1ep";let KEY=null,LASTENC="",LASTJ="",NOENC=false,PW=false,PA=false,OLDENC=null,PWM="";
function b2s(u){let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
const s2b=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
function idbO(){return new Promise((res,rej)=>{const r=indexedDB.open("daftar_k",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){const d=await idbO();return new Promise((res,rej)=>{const q=d.transaction("k").objectStore("k").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbSet(k,v){const d=await idbO();return new Promise((res,rej)=>{const t=d.transaction("k","readwrite");t.objectStore("k").put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function devKey(){
 try{let k=await idbGet("key");if(k)return k;k=await crypto.subtle.generateKey({name:"AES-GCM",length:256},false,["encrypt","decrypt"]);await idbSet("key",k);return k}catch(e){}
 let j=null;try{j=JSON.parse(localStorage.getItem("daftar1k"))}catch(e){}
 if(j)return crypto.subtle.importKey("jwk",j,"AES-GCM",false,["encrypt","decrypt"]);
 const k=await crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt","decrypt"]);
 localStorage.setItem("daftar1k",JSON.stringify(await crypto.subtle.exportKey("jwk",k)));return k}
async function deriveKey(pw,salt){const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function encStr(t){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},KEY,new TextEncoder().encode(t)));return "ENC2:"+b2s(iv)+":"+b2s(ct)}
async function decStr(e){const p=String(e).trim().split(":");
 if(p[0]=="ENC2"&&p.length==3)return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:s2b(p[1])},KEY,s2b(p[2])));
 if(p[0]=="ENC1"&&p.length==4&&PWM){const k=await deriveKey(PWM,s2b(p[1]));return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:s2b(p[2])},k,s2b(p[3])))}
 throw new Error("fmt")}
const decMaybe=async t=>/^ENC[12]:/.test(String(t))?decStr(t):t;
function persist(){if(NOENC){try{localStorage.setItem("daftar1",JSON.stringify(S))}catch(e){}return}if(!KEY)return;PA=true;if(!PW)flush()}
async function flush(){PW=true;while(PA){PA=false;try{const t=JSON.stringify(S);if(t===LASTJ)continue;const e=await encStr(t);if(LASTENC)localStorage.setItem(EKP,LASTENC);localStorage.setItem(EK,e);LASTENC=e;LASTJ=t}catch(x){try{note("تعذر الحفظ المشفر على الجهاز")}catch(_){}}}PW=false}
async function commit(){const t=JSON.stringify(S),e=await encStr(t);localStorage.setItem(EK,e);LASTENC=e;LASTJ=t}
function boxUI(h){$("v").innerHTML=`<div class="card" style="max-width:440px;margin:10vh auto 0;text-align:center">${h}</div>`}
function migUI(msg){boxUI(`<div style="font-size:42px">🔐</div><h1>تحويل التشفير</h1><p class="sub">بياناتك كانت محمية برقم سري. اكتبه مرة واحدة بس، وبعدها التشفير هيشتغل تلقائي من غير رقم سري.</p><label style="display:block;text-align:right;font-size:13px;color:var(--mu)">الرقم السري القديم<input id="pw1" type="password" onkeydown="if(event.key==='Enter')doMig()"></label><div class="err">${esc(msg||"")}</div><button class="btn" style="width:100%" onclick="doMig()">تحويل</button>`);setTimeout(()=>{const e=$("pw1");if(e)e.focus()},50)}
async function doMig(){const a=$("pw1").value;
 try{const p=OLDENC.split(":"),k=await deriveKey(a,s2b(p[1]));S=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:s2b(p[2])},k,s2b(p[3]))))}
 catch(e){return migUI("الرقم السري غلط.")}
 PWM=a;fixS();try{await commit()}catch(e){return migUI("تعذر التحويل: "+(e.message||e))}start()}
function tamperUI(msg){boxUI(`<div style="font-size:42px">⚠️</div><h1>البيانات اتعدلت أو اتخربت</h1><p class="sub">البرنامج اكتشف إن البيانات المشفرة اتغيّرت من برّه. تقدر ترجع آخر نسخة سليمة، أو تلصق نسخة احتياطية.</p><button class="btn" style="width:100%" onclick="restorePrev()">استرجاع آخر نسخة سليمة</button><label style="display:block;text-align:right;font-size:13px;color:var(--mu);margin-top:14px">أو الصق نسخة احتياطية<input id="tbk" placeholder="الصق النص هنا"></label><button class="btn ghost" style="width:100%;margin-top:8px" onclick="restoreTxt()">استرجاع من النص</button><div class="err">${esc(msg||"")}</div>`)}
async function restorePrev(){try{const p=localStorage.getItem(EKP);if(!p)throw 0;S=JSON.parse(await decStr(p));fixS();await commit();start()}catch(e){tamperUI("مفيش نسخة سليمة محفوظة على الجهاز. استخدم النسخة الاحتياطية.")}}
async function restoreTxt(){try{const N=JSON.parse(await decMaybe($("tbk").value.trim()));if(!N||!Array.isArray(N.je)||!Array.isArray(N.inv))throw 0;S=N;fixS();await commit();start()}catch(e){tamperUI("النص غير صحيح.")}}
function start(){document.body.classList.add("ready");mig();render();dbInit()}
async function boot(){
 let ok=!!(window.crypto&&crypto.subtle);if(ok){try{KEY=await devKey()}catch(e){ok=false}}
 if(!ok){NOENC=true;if(LEGACY){try{S=JSON.parse(LEGACY)}catch(e){}}fixS();start();setTimeout(()=>note("التشفير غير متاح في المتصفح ده. افتح الملف من متصفح حديث."),500);return}
 let enc=null;try{enc=localStorage.getItem(EK)}catch(e){}
 if(enc&&enc.startsWith("ENC1:")){OLDENC=enc;return migUI()}
 if(enc){try{S=JSON.parse(await decStr(enc));fixS();LASTENC=enc;LASTJ=JSON.stringify(S)}catch(e){return tamperUI()}}
 else{if(LEGACY){try{S=JSON.parse(LEGACY)}catch(e){}}fixS();S.ts=S.ts||Date.now();
  try{await commit();localStorage.removeItem("daftar1")}catch(e){NOENC=true;KEY=null}}
 start()}
S.cu=S.cu||[];S.pr=S.pr||[];S.rp=S.rp||[];S.mv=S.mv||[];S.ec=S.ec||[];S.ec.forEach(e=>A[e.a]=[e.name,"مصروفات"]);S.k=S.k||1;
const save=()=>{S.ts=Date.now();persist();dbQueue()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f=n=>(+n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const $=id=>document.getElementById(id);
const bal=a=>S.je.reduce((s,j)=>s+j.l.reduce((t,x)=>x.a==a?t+x.d-x.c:t,0),0);
const nat=a=>["أصول","مصروفات"].includes(A[a][1])?bal(a):-bal(a);
const sumT=t=>Object.keys(A).filter(a=>A[a][1]==t).reduce((s,a)=>s+nat(a),0);
const opts=(ks,sel)=>ks.map(k=>`<option value="${k}" ${k==sel?"selected":""}>${k} – ${A[k][0]}</option>`).join("");
function je(date,desc,l,ref){S.je.push({id:S.m++,date,desc,l,ref:ref||null});}
function go(v){view=v;err="";ECU=null;EPR=null;if(typeof CS!=="undefined"){CS.edit="";CS.ask=false}render();try{window.scrollTo(0,0)}catch(e){}}
const NAV=[["dash","لوحة التحكم"],["cu","العملاء"],["pr","المنتجات"],["st","المخزن"],["inv","الفواتير"],["exp","المصروفات"],["tz","الخزينة والبنك"],["cr","مبيعات العملاء"],["rep","التقارير"],["cstock","جرد العملاء"],["sup","الموردين"],["day","إقفال اليوم"],["an","الأرباح والمديونيات"],["bk","النسخ والقفل"]];
function render(){
 $("nav").innerHTML=`<div class="logo">دفتر<small>${esc(S.co)}</small></div>`+NAV.map(([k,t])=>`<button class="${k==view?"on":""}" onclick="go('${k}')">${t}</button>`).join("");
 $("v").innerHTML=({home,bk:backupPage,sup:suppliers,cstock:customerStock,day:dayClose,an:analytics,dash,inv,exp,jrn,rep,cu:cust,pr:prod,st:stock,pinv,cr:crep,tz:treasury})[view]();
}
function dash(){
 const rev=sumT("إيرادات"),ex=sumT("مصروفات"),cash=nat(1010)+nat(1020)+nat(1030)+nat(1040),ar=nat(1100);
 const ms={};S.je.forEach(j=>{const m=j.date.slice(0,7);ms[m]=ms[m]||[0,0];j.l.forEach(x=>{const t=A[x.a][1];if(t=="إيرادات")ms[m][0]+=x.c-x.d;if(t=="مصروفات")ms[m][1]+=x.d-x.c})});
 const keys=Object.keys(ms).sort().slice(-6),mx=Math.max(1,...keys.flatMap(k=>ms[k]));
 const ch=keys.length?`<div class="lg"><span><i style="background:var(--pr)"></i>إيرادات</span><span><i style="background:var(--ac)"></i>مصروفات</span></div><div class="chart">${keys.map(k=>`<div class="grp"><div class="bars"><i title="${f(ms[k][0])}" style="height:${ms[k][0]/mx*100}%;background:var(--pr)"></i><i title="${f(ms[k][1])}" style="height:${ms[k][1]/mx*100}%;background:var(--ac)"></i></div></div>`).join("")}</div><div class="lab">${keys.map(k=>`<div>${k}</div>`).join("")}</div>`:`<div class="empty">لا توجد حركات بعد. أضف فاتورة أو مصروفاً.</div>`;
 return `<h1>مرحباً بك في ${esc(S.co)}</h1><p class="sub">ملخص الوضع المالي حتى اليوم</p>
 <div class="kpis"><div class="kpi"><span>الإيرادات</span><b>${f(rev)}</b></div><div class="kpi ac"><span>المصروفات</span><b>${f(ex)}</b></div><div class="kpi ${rev-ex>=0?"ok":"er"}"><span>صافي الربح</span><b>${f(rev-ex)}</b></div><div class="kpi"><span>النقد والبنك والبريد وإنستاباي</span><b>${f(cash)}</b></div><div class="kpi er"><span>مستحق من العملاء</span><b>${f(ar)}</b></div></div>
 <div class="card"><h2>الإيرادات والمصروفات الشهرية</h2>${ch}</div>
 <div class="card"><h2>اسم المنشأة</h2><div class="row"><label>الاسم<input id="co" value="${esc(S.co)}"></label><button class="btn ghost" onclick="S.co=$('co').value||'شركتي';save();render()">حفظ الاسم</button><button class="btn red" onclick="rst()">${rs?"اضغط مرة أخرى لتأكيد المسح النهائي":"مسح كل البيانات"}</button></div></div>`;
}
function inv(){
 const rows=[...S.inv].reverse().map(i=>`<tr><td>${i.no}</td><td>${i.date}</td><td>${esc(i.cust)}</td><td class="n">${f(i.amt)}${i.ds?` <small>(خصم ${f(i.ds)})</small>`:""}</td><td><span class="tag ${rem(i)<.005?"ok":"er"}">${rem(i)<.005?"مدفوعة":(i.pd?"جزئي – المتبقي "+f(rem(i)):"غير مدفوعة")}</span></td><td>${rem(i)<.005?"":`<button class="btn sm" onclick="collect(${i.id})">تحصيل</button>`}</td></tr>`).join("");
 return `<h1>الفواتير</h1><p class="sub">كل فاتورة تُسجَّل تلقائياً في القيود المحاسبية</p>
 <div class="card"><h2>فاتورة مبيعات جديدة</h2><div class="row"><label>العميل<select id="ic">${S.cu.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")||"<option value=''>أضف عميلاً أولاً</option>"}</select></label><label>المنتج<select id="ipr" onchange="pv()">${S.pr.map(p=>`<option value="${p.id}">${esc(p.name)} (متاح ${p.qty})</option>`).join("")||"<option value=''>أضف منتجاً أولاً</option>"}</select></label><label>الكمية<input id="iq" type="number" min="1" value="1" oninput="pv()"></label><label>التاريخ<input id="id" type="date" value="${today()}" lang="en-CA"></label><label>الخصم<input id="ids" type="number" min="0" step="0.01" placeholder="0" oninput="pv()"></label><label>طريقة الدفع<select id="ip" onchange="pv()"><option value="1010">نقداً</option><option value="1020">عبر البنك</option><option value="1030">عبر البريد</option><option value="1040">عبر إنستاباي</option><option value="0">آجل (على الحساب)</option></select></label><label>المبلغ المدفوع<input id="ipd" type="number" min="0" step="0.01" placeholder="كامل الصافي" oninput="pv()"></label><button class="btn" onclick="addInv()">حفظ الفاتورة</button></div><div id="pvw" class="sub" style="margin:10px 0 0"></div><div class="err">${err}</div></div>
 <div class="card tw">${S.inv.length?`<table><tr><th>الرقم</th><th>التاريخ</th><th>العميل</th><th class="n">المبلغ</th><th>الحالة</th><th></th></tr>${rows}</table>`:`<div class="empty">لا توجد فواتير. أنشئ أول فاتورة من النموذج أعلاه.</div>`}</div>`;
}
function addInv(){const a=+$("ia").value,c=$("ic").value.trim(),p=$("ip").value;
 if(!c||a<=0){err="أدخل اسم العميل ومبلغاً أكبر من صفر.";return render()}
 const no="INV-"+String(S.n).padStart(4,"0"),id=S.n++;
 S.inv.push({id,no,cust:c,date:$("id").value,amt:a,paid:p!="0"});
 je($("id").value,"فاتورة "+no+" – "+c,[{a:p=="0"?1100:+p,d:a,c:0},{a:4010,d:0,c:a}],"inv"+id);err="";save();render()}
function collect(id){const i=S.inv.find(x=>x.id==id);i.paid=true;je(today(),"تحصيل فاتورة "+i.no,[{a:1010,d:i.amt,c:0},{a:1100,d:0,c:i.amt}],"col"+id);save();render()}
function exp(){

(function(){

 customerHeld=function(cid,p,beforeId){
  cid=String(cid);const c=cache(),bk=cid+"|"+(beforeId===undefined||beforeId===null?"":beforeId);
  let m=c.held[bk];

    const seen={};its(i).forEach(x=>{const k=x.pid?"p"+String(x.pid):"n"+String(x.name);if(seen[k])return;seen[k]=1;m[k]={o,v:Math.max(0,Number(x.rt)||0)}})});

 heldAsOf=function(p,D){const last={};

 const _rc=render;render=function(){C=null;return _rc.apply(this,arguments)};
